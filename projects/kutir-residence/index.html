    <!--
      The tab icon animates between two pixel-art frames — see
      src/logic/animatedFavicon.ts, which takes this link over on boot. This
      one is the animation's own first frame rather than a different image, so
      the tab does not visibly flip to something else once the script runs, and
      it is what stands on its own wherever the script cannot: Safari, a failed
      script, or a reader that never runs JavaScript at all.

      The pixel portrait stays on as the iOS home-screen icon, where there is
      no animation to be had anyway.
    -->
    <link rel="icon" href="/favicon-ily.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three faces, one job each. Bangers is the display voice across the menu,
      the panels and the case studies. Archivo sets every piece of running
      text — it shares a skeleton with Archivo Black, which is the fallback
      for 'Hit Me Punk' (the local face used by the loading screen and the
      share card), so the page holds together when the display font is still
      in flight. Utility labels use the local monospace stack.

      Body text was previously Segoe UI — i.e. whatever the OS happened to
      supply, which is what a page looks like when nobody picked a font — and
      Kalam, a handwriting face, was setting long paragraphs inside the
      panels. Both are gone.

      Poppins is the exception, and a deliberate one: it is only used to set
      the MOVANA sheet's own labels back onto its drawing, because that sheet
      was lettered in it and the live text has to read as part of the print.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&family=Bangers&family=Poppins:wght@300;400&display=swap"
      rel="stylesheet"
    />
