<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Parag Chavhan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:'DM Mono',monospace;color:#f4f0e8;}

#c{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

/* Nav */
#nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 40px;z-index:30}
.back{font-size:9px;letter-spacing:.22em;color:rgba(244,240,232,.35);text-decoration:none;transition:color .3s}
.back:hover{color:#f4f0e8}
.proj-id{font-family:'Syne',sans-serif;font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--accent,#fff)}

/* Progress dots */
#progress{position:fixed;right:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:30}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(244,240,232,.15);cursor:pointer;transition:all .5s;position:relative}
.dot::after{content:attr(data-l);position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:7px;letter-spacing:.16em;white-space:nowrap;color:rgba(244,240,232,.0);transition:color .4s;pointer-events:none}
.dot.on{transform:scale(2);background:var(--accent,#fff)}
.dot.on::after{color:rgba(244,240,232,.35)}

/* Zone counter */
#zcnt{position:fixed;left:40px;bottom:48px;z-index:30;font-size:9px;letter-spacing:.25em;color:rgba(244,240,232,.2);pointer-events:none}

/* Scroll hint */
#hint{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);text-align:center;z-index:30;transition:opacity .8s;pointer-events:none}
#hint p{font-size:8px;letter-spacing:.28em;color:rgba(244,240,232,.22);margin-bottom:8px}
#hint div{animation:bob .9s ease-in-out infinite alternate;font-size:12px;color:rgba(244,240,232,.16)}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(6px)}}

/* Zone overlays */
.zone-overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;
  padding:0 9vw;pointer-events:none;
  opacity:0;transform:translateX(20px);
  transition:opacity .6s ease, transform .6s ease;
}
.zone-overlay.left{justify-content:flex-start}
.zone-overlay.right{justify-content:flex-end}
.zone-overlay.center{justify-content:center;text-align:center}
.zone-overlay.on{opacity:1;transform:translateX(0);pointer-events:all}

.zo-inner{max-width:420px}
.zo-tag{font-size:8px;letter-spacing:.28em;color:var(--accent,#fff);display:block;margin-bottom:14px}
.zo-head{font-family:'Syne',sans-serif;font-size:clamp(22px,3vw,48px);font-weight:800;line-height:.92;letter-spacing:-.03em;color:#f4f0e8;margin-bottom:16px}
.zo-sub{font-family:'Syne',sans-serif;font-size:clamp(13px,1.4vw,20px);font-weight:700;color:var(--accent,.6);opacity:.7;margin-bottom:14px;letter-spacing:-.01em}
.zo-body{font-size:11px;line-height:2;color:rgba(244,240,232,.42);font-style:italic}
.zo-rule{width:36px;height:1px;background:var(--accent,#fff);opacity:.4;margin:18px 0}
.zo-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;margin-top:18px}
.zo-meta-item span:first-child{font-size:7px;letter-spacing:.25em;color:rgba(244,240,232,.22);display:block;margin-bottom:3px}
.zo-meta-item span:last-child{font-size:10px;color:rgba(244,240,232,.6)}

/* Drawing placeholders */
.draw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;max-width:420px}
.draw-block{aspect-ratio:4/3;border:1px solid rgba(244,240,232,.08);display:flex;align-items:center;justify-content:center;background:rgba(244,240,232,.03)}
.draw-block span{font-size:7px;letter-spacing:.18em;color:rgba(244,240,232,.1)}

/* Process row */
.proc-row{display:flex;gap:10px;margin-top:18px;max-width:420px}
.proc-block{flex:1;aspect-ratio:1;border:1px solid rgba(244,240,232,.08);display:flex;align-items:center;justify-content:center;background:rgba(244,240,232,.03)}
.proc-block span{font-size:6px;letter-spacing:.16em;color:rgba(244,240,232,.1)}

/* CTA */
.zo-cta{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:22px;font-size:9px;letter-spacing:.22em;
  color:var(--accent,#fff);text-decoration:none;
  border:1px solid currentColor;
  padding:11px 22px;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(6px);
  transition:background .3s, color .3s, transform .2s;
}
.zo-cta:hover{background:var(--accent,#fff);color:#0a0a12;transform:translateY(-2px)}

/* Scroll space */
#ss{height:900vh}
</style>
</head>
<body>
<canvas id="c"></canvas>

<nav id="nav">
  <a class="back" href="studio.html">← Portfolio</a>
  <span class="proj-id" id="proj-id"></span>
</nav>

<div id="progress"></div>
<div id="zcnt">SECTION <b id="znum">01</b></div>
<div id="hint"><p>SCROLL TO EXPLORE</p><div>↓</div></div>

<div id="zones"></div>
<div id="ss"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script type="module">
import * as THREE from 'three';
const gsap = window.gsap, ScrollTrigger = window.ScrollTrigger;
const W = () => window.innerWidth, H = () => window.innerHeight;

/* ── Project definitions ──────────────────────────────────────────────────── */
const PROJECTS = [null,
  { num:'01/06', name:'Project Alpha',   cat:'Urban Housing',    accent:0x00eeff, accentCSS:'#00eeff',
    bg:['#020d12','#041820','#061d28'],
    cloudA:0x00c8e8, cloudB:0x0098b8, cloudH:0xe8f8ff, fog:0x041820,
    tagline:'Density as community.',
    overview:'A housing complex that questions how density and community coexist. Compact, breathable, community-forward. Every unit faces a shared court — privacy negotiated by level, not walls.',
    detail:'The project began as a question: what if affordable housing did not mean the erasure of neighbourhood identity? The answer was found in section.',
    year:'2023', site:'Mumbai', area:'4,200 sqm', status:'Design Development' },
  { num:'02/06', name:'Project Beta',    cat:'Cultural Centre',  accent:0xff44cc, accentCSS:'#ff44cc',
    bg:['#120210','#200318','#2a0420'],
    cloudA:0xe830a8, cloudB:0xb82080, cloudH:0xffe0f8, fog:0x200318,
    tagline:'Where programme dissolves into landscape.',
    overview:'A public cultural landmark where building and ground are no longer separate. The building continues into the earth, pulling visitors through compressed-then-released spatial sequences.',
    detail:'The parti: a single continuous surface that folds from horizontal ground plane to vertical civic wall. Exhibition, performance, and gathering housed in the folds.',
    year:'2024', site:'Pune', area:'8,600 sqm', status:'Concept' },
  { num:'03/06', name:'Project Gamma',   cat:'Spatial Installation', accent:0xffd700, accentCSS:'#ffd700',
    bg:['#131000','#201800','#2a2000'],
    cloudA:0xe8c000, cloudB:0xb89000, cloudH:0xfff8e0, fog:0x201800,
    tagline:'The threshold between solitude and crowd.',
    overview:'A temporary installation exploring what it means to be alone inside a public space. A latticed canopy of bent mild steel and string creates shifting shadow geometries that track solar movement.',
    detail:'Visitors enter individually through narrow apertures. Inside the space opens suddenly — an unexpected vertical release.',
    year:'2023', site:'Nashik Art Festival', area:'320 sqm', status:'Built' },
  { num:'04/06', name:'Project Delta',   cat:'Residential',      accent:0xff8844, accentCSS:'#ff8844',
    bg:['#130600','#200c00','#2a1000'],
    cloudA:0xe06020, cloudB:0xb04010, cloudH:0xfff0e8, fog:0x200c00,
    tagline:'Four houses, one courtyard.',
    overview:'Four independent houses arranged around a shared courtyard negotiated through geometry and level, not walls. Ownership is clear; territory is ambiguous.',
    detail:'Each house steps back at a different height, creating a reading of the shared space that shifts as you move through it.',
    year:'2024', site:'Nashik', area:'1,200 sqm', status:'Design Development' },
  { num:'05/06', name:'Project Epsilon', cat:'Museum',            accent:0x88ff44, accentCSS:'#88ff44',
    bg:['#050f00','#081800','#0c2200'],
    cloudA:0x58d820, cloudB:0x38a810, cloudH:0xf0ffe0, fog:0x081800,
    tagline:'You see things being made.',
    overview:'A museum of living craft organised not by object but by process. Visitors follow the arc of making — raw material, transformation, finished form — in a continuous spatial loop.',
    detail:'The building section is inverted: workshops occupy the top floors with north light, galleries are below, material storage is visible as a vertical core.',
    year:'2024', site:'Ahmedabad', area:'6,800 sqm', status:'Concept' },
  { num:'06/06', name:'Project Zeta',    cat:'Transit + Urban',  accent:0xcc44ff, accentCSS:'#cc44ff',
    bg:['#0a0014','#100020','#180030'],
    cloudA:0xa820e0, cloudB:0x8010b0, cloudH:0xf8e0ff, fog:0x100020,
    tagline:'Infrastructure that insists on being civic.',
    overview:'A transit hub that refuses to be only infrastructure. Every waiting space is also a civic one — open to the city even when no trains are running.',
    detail:'The roof is a public park. The concourse is a covered market. Platform waiting organised not as queuing but as inhabitable landscape.',
    year:'2023', site:'Nagpur', area:'22,000 sqm', status:'Urban Study' },
];

const id = Math.max(1, Math.min(6, parseInt(new URLSearchParams(location.search).get('id')) || 1));
const P = PROJECTS[id];

document.title = `${P.name} — Parag Chavhan`;
document.getElementById('proj-id').textContent = P.num;
document.documentElement.style.setProperty('--accent', P.accentCSS);

/* ── Three.js scene ───────────────────────────────────────────────────────── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(P.fog, 0.0022);

const camera = new THREE.PerspectiveCamera(68, W()/H(), 0.1, 600);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, alpha:true});
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W(), H());

/* Body background */
document.body.style.background = `radial-gradient(ellipse at 40% 30%, ${P.bg[1]} 0%, ${P.bg[0]} 55%), linear-gradient(180deg, ${P.bg[2]} 0%, ${P.bg[0]} 100%)`;
document.body.style.backgroundAttachment = 'fixed';

/* ── Camera path — descends along Y, weaves X, Z stays shallow ───────────── */
const PATH = new THREE.CatmullRomCurve3([
  new THREE.Vector3(  0,   0,  18),
  new THREE.Vector3( -8, -30,  14),
  new THREE.Vector3(  6, -80,  16),   // Z0 hero
  new THREE.Vector3( 18,-140,  12),
  new THREE.Vector3( -6,-200,  16),   // Z1 overview
  new THREE.Vector3(-20,-260,  14),
  new THREE.Vector3(  8,-320,  16),   // Z2 drawings
  new THREE.Vector3( 20,-380,  12),
  new THREE.Vector3( -8,-440,  16),   // Z3 process
  new THREE.Vector3(-16,-500,  14),
  new THREE.Vector3(  0,-560,  15),   // Z4 next
], false, 'catmullrom', 0.5);

const ZONE_COUNT = 5;
const zoneOf = p => Math.min(Math.floor(p * ZONE_COUNT), ZONE_COUNT-1);

/* ── Accent color helpers ─────────────────────────────────────────────────── */
const acCol = new THREE.Color(P.accent);
const lineMat = (op=0.7) => new THREE.LineBasicMaterial({color:acCol, transparent:true, opacity:op});
function wireObj(geo, op=0.7){ return new THREE.LineSegments(new THREE.WireframeGeometry(geo), lineMat(op)); }
function ring(r, tilt=0){
  const pts=[];
  for(let i=0;i<=72;i++){const a=(i/72)*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(.12));
  l.rotation.x=tilt; return l;
}

/* ── Zone stations (floating structure at each content zone) ─────────────── */
const STATION_POS = [
  new THREE.Vector3( 18,  -70, 20),   // hero
  new THREE.Vector3(-24, -200, 18),   // overview
  new THREE.Vector3( 22, -330, 20),   // drawings
  new THREE.Vector3(-20, -455, 18),   // process
  new THREE.Vector3(  0, -560, 16),   // next
];
const STATION_GEOS = [
  ()=>new THREE.IcosahedronGeometry(4,0),
  ()=>new THREE.OctahedronGeometry(3.5,0),
  ()=>new THREE.DodecahedronGeometry(3.2,0),
  ()=>new THREE.TetrahedronGeometry(3.8,0),
  ()=>new THREE.TorusGeometry(3,.9,8,20),
];
const stationGroups = [];
STATION_POS.forEach((pos,i)=>{
  const g = new THREE.Group(); g.position.copy(pos);
  g.add(wireObj(STATION_GEOS[i](), 0.8));
  [5,8,12].forEach((r,ri)=>{ const rl=ring(r, Math.PI/2+ri*.4); rl.rotation.z=ri*.6; g.add(rl); });
  // Orbiting mini-shapes
  for(let j=0;j<6;j++){
    const m=wireObj(new THREE.OctahedronGeometry(.4,0), .25);
    m.position.set((Math.random()-.5)*16,(Math.random()-.5)*16,(Math.random()-.5)*10);
    g.add(m);
  }
  scene.add(g); stationGroups.push(g);
});

/* ── Stars ────────────────────────────────────────────────────────────────── */
/* Stars spread vertically alongside the descent */
const SN=3000, sp=new Float32Array(SN*3), sc=new Float32Array(SN*3);
for(let i=0;i<SN;i++){
  sp[i*3]  = (Math.random()-.5)*280;
  sp[i*3+1]= -Math.random()*660 + 20;
  sp[i*3+2]=  (Math.random()-.5)*120 + 15;
  const b=.4+Math.random()*.6;
  sc[i*3]=acCol.r*b; sc[i*3+1]=acCol.g*b; sc[i*3+2]=acCol.b*b;
}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({vertexColors:true,size:.12,transparent:true,opacity:.85,sizeAttenuation:true})));

/* ── PNG sprite clouds ─────────────────────────────────────────────────────── */
const _cloudTextures=[
  new THREE.TextureLoader().load('cloud1.png'),
  new THREE.TextureLoader().load('cloud2.png'),
];
function makeCloud(size,seed){
  seed=seed||0;
  const grp=new THREE.Group();
  const rng=(n)=>{const x=Math.sin(seed*127.1+n*311.7)*43758.5453;return x-Math.floor(x);};
  const layers=3+Math.floor(rng(0)*3);
  for(let i=0;i<layers;i++){
    const tex=_cloudTextures[Math.floor(rng(i*3)*_cloudTextures.length)];
    const w=size*(1.2+rng(i*3+1)*0.8);
    const h=w*(0.45+rng(i*3+2)*0.25);
    const plane=new THREE.Mesh(
      new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.55+rng(i)*0.35,depthWrite:false,side:THREE.DoubleSide})
    );
    plane.position.set(
      (rng(i*3)*2-1)*size*0.35,
      (rng(i*3+1)*2-1)*size*0.12,
      (rng(i*3+2)*2-1)*size*0.2
    );
    plane.rotation.z=(rng(i)*2-1)*0.08;
    grp.add(plane);
  }
  return grp;
}

/* Clouds arranged vertically — X wide, Y descends, Z shallow depth */
const CLOUD_DATA=[
  [ 30,  -15, 22, 10], [-36,  -55, 18, 13], [ 24, -100, 24,  9], [-20, -145, 20, 12],
  [ 38, -190, 22,  8], [-42, -235, 18, 14], [ 26, -275, 24, 10], [-28, -315, 20, 11],
  [ 40, -355, 22,  9], [-32, -395, 18, 13], [ 22, -435, 24,  8], [-38, -475, 20, 12],
  [ 34, -510, 22, 10], [-24, -545, 18, 11],
];
const cloudGroups=CLOUD_DATA.map(([x,y,z,size],i)=>{
  const cl=makeCloud(size,i); cl.position.set(x,y,z); scene.add(cl); return cl;
});

/* ── Floating islands (light, project-tinted) ─────────────────────────────── */
function terrainY(x,z,size){
  const r=Math.sqrt(x*x+z*z);
  return(Math.sin(x*.85+z*.6)*.3+Math.sin(x*1.9-z*1.3)*.16+Math.sin(z*.7-x*.45)*.22-(r/size)*.45)*size*.35;
}
function makeIsland(size){
  const grp=new THREE.Group(), RS=18;
  const topGeo=new THREE.CylinderGeometry(size,size*.82,size*.5,RS,4);
  const tPos=topGeo.attributes.position;
  for(let i=0;i<tPos.count;i++){
    const x=tPos.getX(i),y=tPos.getY(i),z=tPos.getZ(i);
    if(y>size*.05) tPos.setY(i,y+terrainY(x,z,size));
    else { const e=.82+Math.random()*.2; tPos.setX(i,x*e); tPos.setZ(i,z*e); tPos.setY(i,y+(Math.random()-.5)*size*.1); }
  }
  topGeo.computeVertexNormals();
  // Rock body tinted toward project color
  const rocK = new THREE.Color(0x4a5040).lerp(acCol, 0.15);
  grp.add(new THREE.Mesh(topGeo, new THREE.MeshBasicMaterial({color:rocK})));
  // Grass cap
  const gGeo=new THREE.CylinderGeometry(size*.78,size*.78,size*.06,RS,1);
  const gPos=gGeo.attributes.position;
  for(let i=0;i<gPos.count;i++){const x=gPos.getX(i),y=gPos.getY(i),z=gPos.getZ(i);if(y>0)gPos.setY(i,size*.26+terrainY(x,z,size)+.02);}
  gGeo.computeVertexNormals();
  const grassC = new THREE.Color(0x3a7030).lerp(acCol, 0.18);
  grp.add(new THREE.Mesh(gGeo, new THREE.MeshBasicMaterial({color:grassC})));
  // Stalactites
  for(let s=0;s<4;s++){
    const a=s*(Math.PI*.5)+Math.random()*.4, ro=(.2+Math.random()*.35)*size;
    const sh=size*(.5+Math.random()*.7), sr=size*(.05+Math.random()*.08);
    const sp=new THREE.Mesh(new THREE.CylinderGeometry(sr*.05,sr,sh,8),new THREE.MeshBasicMaterial({color:rocK}));
    sp.position.set(Math.cos(a)*ro,-(size*.1+sh*.5),Math.sin(a)*ro); grp.add(sp);
  }
  return grp;
}
/* Islands stacked vertically */
const ISLAND_DATA=[
  [ 28, -50, 22, 4], [-30,-130, 18, 3.5], [ 40,-215, 24, 5],
  [-22,-300, 20, 3.8], [ 32,-385, 22, 4.2], [-36,-465, 18, 3.2],
];
const islandGroups=ISLAND_DATA.map(([x,y,z,size])=>{
  const isl=makeIsland(size); isl.position.set(x,y,z); scene.add(isl); return isl;
});

/* ── Build zone overlay HTML ──────────────────────────────────────────────── */
const nextId = id%6+1;
const ZONES_DEF = [
  { align:'left', label:'Hero', html:`
    <div class="zo-inner">
      <span class="zo-tag">${P.num} &nbsp;·&nbsp; ${P.cat}</span>
      <h1 class="zo-head">${P.name}</h1>
      <p class="zo-sub">${P.tagline}</p>
      <div class="zo-rule"></div>
      <div class="zo-meta">
        <div class="zo-meta-item"><span>Year</span><span>${P.year}</span></div>
        <div class="zo-meta-item"><span>Site</span><span>${P.site}</span></div>
        <div class="zo-meta-item"><span>Area</span><span>${P.area}</span></div>
        <div class="zo-meta-item"><span>Status</span><span>${P.status}</span></div>
      </div>
    </div>` },
  { align:'right', label:'Overview', html:`
    <div class="zo-inner">
      <span class="zo-tag">Overview</span>
      <h2 class="zo-head" style="font-size:clamp(18px,2.2vw,32px)">${P.overview}</h2>
      <div class="zo-rule"></div>
      <p class="zo-body">${P.detail}</p>
    </div>` },
  { align:'left', label:'Drawings', html:`
    <div class="zo-inner">
      <span class="zo-tag">Drawings &amp; Models</span>
      <h2 class="zo-head" style="font-size:clamp(16px,1.8vw,26px)">The argument in plan, section, and three dimensions.</h2>
      <div class="draw-grid">
        <div class="draw-block"><span>Site Plan</span></div>
        <div class="draw-block"><span>Ground Floor</span></div>
        <div class="draw-block"><span>Section A-A</span></div>
        <div class="draw-block"><span>Axonometric</span></div>
      </div>
    </div>` },
  { align:'right', label:'Process', html:`
    <div class="zo-inner">
      <span class="zo-tag">Design Process</span>
      <h2 class="zo-head" style="font-size:clamp(16px,1.8vw,26px)">Every decision traces back to a single spatial question.</h2>
      <div class="zo-rule"></div>
      <p class="zo-body">Models were built iteratively: cardboard to balsa to final presentation, each interrogating a different variable.</p>
      <div class="proc-row">
        <div class="proc-block"><span>Sketch</span></div>
        <div class="proc-block"><span>Study Model</span></div>
        <div class="proc-block"><span>Final</span></div>
      </div>
    </div>` },
  { align:'center', label:'Next', html:`
    <div class="zo-inner" style="text-align:center;max-width:400px">
      <span class="zo-tag">See More Work</span>
      <h2 class="zo-head" style="font-size:clamp(22px,3vw,46px)">Keep exploring.</h2>
      <div class="zo-rule" style="margin:18px auto"></div>
      <a class="zo-cta" href="studio.html">Back to Portfolio -></a>
      &nbsp;&nbsp;&nbsp;
      <a class="zo-cta" href="project.html?id=${nextId}">Next Project -></a>
    </div>` },
];

const zonesEl = document.getElementById('zones');
const overlays = [];
ZONES_DEF.forEach((def,i)=>{
  const d=document.createElement('div');
  d.className=`zone-overlay ${def.align}`+(i===0?' on':'');
  d.id=`z${i}`;
  d.innerHTML=def.html;
  zonesEl.appendChild(d); overlays.push(d);
});

/* ── Progress dots ─────────────────────────────────────────────────────────── */
const progressEl=document.getElementById('progress');
const dots=[];
ZONES_DEF.forEach((def,i)=>{
  const d=document.createElement('div');
  d.className='dot'+(i===0?' on':'');
  d.dataset.l=def.label;
  d.addEventListener('click',()=>{
    const frac=i/(ZONE_COUNT-1);
    window.scrollTo({top:document.getElementById('ss').offsetHeight*frac,behavior:'smooth'});
  });
  progressEl.appendChild(d); dots.push(d);
});

/* ── Animate ───────────────────────────────────────────────────────────────── */
const mouse={x:0,y:0}, pan={x:0,y:0};
window.addEventListener('mousemove',e=>{
  mouse.x= (e.clientX/window.innerWidth -.5)*2;
  mouse.y=-(e.clientY/window.innerHeight-.5)*2;
});
const _fwd=new THREE.Vector3(),_right=new THREE.Vector3(),_lookPt=new THREE.Vector3(),_paraPt=new THREE.Vector3();

// Set camera to path start immediately so scene renders before first scroll
const camUp=new THREE.Vector3(0,0,-1);
camera.position.copy(PATH.getPointAt(0));
_lookPt.copy(PATH.getPointAt(0.012));
camera.up.copy(camUp);
camera.lookAt(_lookPt);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  stationGroups.forEach((g,i)=>{
    g.children[0].rotation.x+=.003+i*.0006;
    g.children[0].rotation.y+=.005+i*.0004;
    if(g.children[1])g.children[1].rotation.y+=.004;
    if(g.children[2])g.children[2].rotation.y-=.003;
  });
  islandGroups.forEach((isl,i)=>{
    isl.position.x=ISLAND_DATA[i][0]+Math.sin(t*.18+i*1.1)*.4;
    isl.position.z=ISLAND_DATA[i][2]+Math.sin(t*.22+i*.9)*.3;
    isl.rotation.y+=.0004;
  });
  cloudGroups.forEach((cl,i)=>{
    cl.position.x=CLOUD_DATA[i][0]+Math.sin(t*.10+i*.9)*1.0;
    cl.position.z=CLOUD_DATA[i][2]+Math.sin(t*.14+i*1.7)*.5;
  });
  pan.x+=(mouse.x-pan.x)*.02; pan.y+=(mouse.y-pan.y)*.02;
  _paraPt.copy(_lookPt)
    .addScaledVector(_right, pan.x*1.2)
    .addScaledVector(camUp,  pan.y*0.7);
  camera.lookAt(_paraPt);
  renderer.render(scene,camera);
}
animate();

/* ── Scroll ────────────────────────────────────────────────────────────────── */
gsap.registerPlugin(ScrollTrigger);
const znumEl=document.getElementById('znum');
const hintEl=document.getElementById('hint');
let lastZone=-1;

ScrollTrigger.create({
  trigger:'#ss', start:'top top', end:'bottom bottom', scrub:4,
  onUpdate(self){
    const p=self.progress;
    const camPt=PATH.getPointAt(p);
    const aheadPt=PATH.getPointAt(Math.min(p+.012,1));
    camera.position.copy(camPt);
    // Downward travel — keep Z-back as up, bank slightly on X turns only
    const fwd=aheadPt.clone().sub(camPt).normalize();
    const bank=fwd.x*.12;
    camUp.set(Math.sin(-bank), 0, -Math.cos(bank));
    camera.up.copy(camUp);
    _lookPt.copy(aheadPt);
    camera.lookAt(_lookPt);
    _right.crossVectors(fwd, camUp).normalize();

    // Fog color shift through project accent
    const fc=new THREE.Color(P.fog).lerp(acCol, p*.15);
    scene.fog.color.copy(fc);

    const zone=zoneOf(p);
    if(zone!==lastZone){
      lastZone=zone;
      dots.forEach((d,i)=>d.classList.toggle('on',i===zone));
      overlays.forEach((o,i)=>o.classList.toggle('on',i===zone));
      znumEl.textContent=String(zone+1).padStart(2,'0');
    }
    hintEl.style.opacity=p>.02?'0':'1';
  }
});

window.addEventListener('resize',()=>{
  camera.aspect=W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
});
</script>
</body>
